<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 400">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3018"/>
      <stop offset="50%" stop-color="#6e4825"/>
      <stop offset="100%" stop-color="#3d2510"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5b5"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a00"/>
    </linearGradient>
  </defs>

  <!-- Pole -->
  <rect x="65" y="0" width="20" height="400" fill="url(#wood)" rx="5"/>
  <path d="M 65 0 L 85 0 L 80 400 L 70 400 Z" fill="rgba(0,0,0,0.2)"/>

  <!-- Crossbar -->
  <rect x="25" y="20" width="100" height="15" fill="url(#wood)" rx="5"/>
  
  <!-- Hanging rope -->
  <path d="M 75 35 L 75 80" stroke="#d4b58e" stroke-width="4" stroke-dasharray="2,2"/>

  <!-- Jamby Plate -->
  <circle cx="75" cy="110" r="40" fill="url(#gold)"/>
  
  <!-- Ornament on Jamby -->
  <circle cx="75" cy="110" r="25" fill="none" stroke="#664d00" stroke-width="3"/>
  <path d="M 75 95 C 65 95, 60 110, 75 125 C 90 110, 85 95, 75 95" fill="#664d00"/>
</svg>
